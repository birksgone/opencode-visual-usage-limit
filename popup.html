<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      background: #0d0d0d;
      color: #cbd5e1;
      font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1c1c1c;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .refresh-btn {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: inherit;
      letter-spacing: 0.05em;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .refresh-btn:hover:not(:disabled) { color: #e2e8f0; border-color: #475569; background: #1a1a1a; }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Section ── */
    .section {
      padding: 14px 16px 14px;
      border-bottom: 1px solid #141414;
    }
    .section:last-of-type { border-bottom: none; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Bar row (text) ── */
    .bar-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .bar-chars {
      font-size: 16px;
      letter-spacing: 2px;
      color: #334155;
      transition: color 0.3s;
    }
    .bar-pct {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      min-width: 40px;
      transition: color 0.3s;
    }
    .bar-detail {
      font-size: 12px;
      color: #64748b;
    }
    .bar-detail .hi { color: #e2e8f0; }

    /* Bar color classes */
    .c-green  { color: #22c55e; }
    .c-lime   { color: #84cc16; }
    .c-yellow { color: #eab308; }
    .c-orange { color: #f97316; }
    .c-red    { color: #ef4444; }
    .c-muted  { color: #475569; }

    /* ── Zen credit ── */
    .zen-value {
      font-size: 28px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .zen-value.c-muted { color: #475569; }
    .zen-sub {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    /* ── Login section ── */
    .login-section {
      padding: 18px 16px;
      text-align: center;
    }
    .login-msg {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .login-btn {
      background: #22c55e;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-btn:hover { background: #4ade80; }

    /* ── Error state ── */
    .error-section {
      padding: 18px 16px;
      text-align: center;
    }
    .error-msg  { color: #ef4444; font-size: 13px; margin-bottom: 6px; }
    .error-hint { color: #64748b; font-size: 12px; }

    /* ── Settings panel ── */
    .settings-toggle {
      display: block;
      background: none;
      border: none;
      color: #475569;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      padding: 6px 16px;
      width: 100%;
      text-align: left;
      letter-spacing: 0.08em;
      transition: color 0.15s;
    }
    .settings-toggle:hover { color: #94a3b8; }
    .settings-panel {
      display: none;
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
      padding: 10px 16px;
    }
    .settings-panel.open { display: block; }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-label {
      font-size: 11px;
      color: #64748b;
    }
    .settings-select {
      background: #1a1a1a;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ── Debug panel ── */
    .debug-toggle {
      display: block;
      background: none;
      border: none;
      color: #1e293b;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      padding: 6px 16px;
      width: 100%;
      text-align: left;
      letter-spacing: 0.08em;
    }
    .debug-toggle:hover { color: #334155; }
    .debug-panel {
      display: none;
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
      padding: 10px 16px;
    }
    .debug-panel.open { display: block; }
    .debug-pre {
      font-size: 10px;
      color: #475569;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.5;
    }

    /* ── Footer ── */
    .footer {
      padding: 6px 16px 8px;
      font-size: 11px;
      color: #334155;
      letter-spacing: 0.05em;
      border-top: 1px solid #111;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="header-title">opencode Go-Zen Monitor</span>
    </div>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>

  <!-- Login prompt (shown when not logged in) -->
  <div class="login-section" id="loginSection" style="display: none;">
    <div class="login-msg">Log in to opencode.ai to see your Go & Zen usage data.</div>
    <button class="login-btn" id="loginBtn">Open OpenCode Website</button>
    <button class="login-btn" id="detectUrlBtn" style="margin-top: 8px; background: #475569;">Detect from current tab</button>
  </div>

  <!-- ROLLING (5H) LIMIT -->
  <div class="section" id="rollingSection">
    <div class="section-label">ROLLING LIMIT · 5H WINDOW</div>
    <div class="bar-row">
      <span class="bar-chars c-muted" id="bar5h">▱▱▱▱▱▱▱▱▱▱</span>
      <span class="bar-pct c-muted"   id="pct5h">--%</span>
    </div>
    <div class="bar-detail" id="detail5h">Loading...</div>
  </div>

  <!-- WEEKLY (7D) LIMIT -->
  <div class="section" id="weeklySection">
    <div class="section-label">WEEKLY LIMIT · 7D WINDOW</div>
    <div class="bar-row">
      <span class="bar-chars c-muted" id="bar7d">▱▱▱▱▱▱▱▱▱▱</span>
      <span class="bar-pct c-muted"   id="pct7d">--%</span>
    </div>
    <div class="bar-detail" id="detail7d">Loading...</div>
  </div>

  <!-- ZEN CREDIT -->
  <div class="section" id="zenSection">
    <div class="section-label">ZEN CREDIT</div>
    <div class="zen-value c-muted" id="zenValue">$ --</div>
    <div class="zen-sub" id="zenSub">Balance</div>
  </div>

  <!-- Settings -->
  <button class="settings-toggle" id="settingsToggle">▸ Settings</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row" style="flex-direction: column; align-items: stretch; gap: 4px;">
      <span class="settings-label">Workspace URL (optional)</span>
      <input class="settings-input" id="workspaceUrl" type="text" placeholder="https://opencode.ai/workspace/.../go" style="background: #1a1a1a; border: 1px solid #334155; color: #e2e8f0; font-family: inherit; font-size: 10px; padding: 4px 8px; border-radius: 4px; width: 100%;">
      <span style="font-size: 9px; color: #475569;">Auto-detected if left empty</span>
    </div>
    <div class="settings-row">
      <span class="settings-label">Auto-refresh interval</span>
      <select class="settings-select" id="intervalSelect">
        <option value="1">1 min</option>
        <option value="5">5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
      </select>
    </div>
  </div>

  <!-- Debug (hidden by default) -->
  <button class="debug-toggle" id="debugToggle">▸ debug</button>
  <div class="debug-panel" id="debugPanel">
    <pre class="debug-pre" id="debugPre"></pre>
  </div>

  <div class="footer" id="footer">--</div>

  <script src="popup.js"></script>
</body>
</html>
